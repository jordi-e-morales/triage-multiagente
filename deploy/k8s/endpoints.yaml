# Apuntes de endpoints: a dónde habla cada componente y qué modelo usa.
#
# Es la fuente de verdad de servicios/config.py. Cada Deployment lo carga con
#   envFrom:
#     - configMapRef:
#         name: endpoints
# y cada clave se vuelve una variable de entorno dentro del contenedor.
#
# Para cambiar un apunte (por ejemplo, al pasar a dCloud):
#   kubectl apply -f deploy/k8s/endpoints.yaml
#   kubectl -n agentes rollout restart deploy
# El restart hace falta porque las variables de entorno solo se leen al
# arrancar el contenedor.
#
# La página Admin de la UI muestra estos valores y prueba que respondan, pero
# no los cambia (decisión de seguridad, ver servicios/config.py).

apiVersion: v1
kind: ConfigMap
metadata:
  name: endpoints
  namespace: agentes
data:
  # Componentes. "orquestador" es el nombre del Service de Kubernetes, que
  # resuelve por DNS dentro del namespace. Todos escuchan en el 8000.
  URL_ORQUESTADOR: "http://orquestador:8000"
  URL_ENRIQUECEDOR: "http://enriquecedor:8000"
  URL_INVESTIGADOR: "http://investigador:8000"
  URL_DEFENSOR: "http://defensor:8000"
  URL_ARBITRO: "http://arbitro:8000"
  URL_REGISTRO: "http://registro:8000"
  URL_OBSERVADOR: "http://observador:8000"
  URL_GUARDRAIL: "http://guardrail:8000"

  # Modelos. En el lab local los dos apuntan al mismo contenedor de Ollama.
  # En dCloud: LLM_LOCAL_* -> vLLM con el 7B, LLM_GRANDE_* -> vLLM con el 32B.
  # Se usa qwen2.5:7b: con el 3B el debate no sostenía los roles (el Defensor
  # terminaba argumentando que había que escalar). 7B es además el tamaño que
  # el plan asigna al Enriquecedor en dCloud.
  LLM_LOCAL_URL: "http://ollama:11434"
  LLM_LOCAL_MODELO: "qwen2.5:7b"
  LLM_GRANDE_URL: "http://ollama:11434"
  LLM_GRANDE_MODELO: "qwen2.5:7b"
  # Ventana de contexto pedida en cada llamada. qwen2.5:7b admite hasta 32768.
  # Más ventana = más RAM para la caché; 8192 alcanza para los expedientes
  # chicos de desarrollo. Si un prompt no cabe, la llamada falla (no recorta).
  LLM_NUM_CTX: "8192"

  # Presupuesto de tokens por caso que aplica el Orquestador (prompt +
  # respuesta). El debate completo de aml-0042 con 7b gastó ~15.8k.
  PRESUPUESTO_TOKENS_CASO: "30000"
  # Tiempo máximo de una llamada entre componentes. En CPU un paso con salto
  # lateral encadena dos llamadas al modelo.
  TIMEOUT_AGENTE_S: "1800"

  # "0" oculta la página Admin (presets del stand).
  MOSTRAR_ADMIN: "1"
