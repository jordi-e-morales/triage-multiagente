# ─── Registro (no es agente) ─────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registro
  namespace: agentes
spec:
  # Una sola réplica: el registro vive en memoria. Con dos, cada pod tendría
  # su propia copia y las lecturas no coincidirían.
  replicas: 1
  selector:
    matchLabels: {app: registro}
  template:
    metadata:
      labels: {app: registro, rol: registro}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: registro
          image: triage-agentes:0.3.0
          imagePullPolicy: Never
          env:
            - {name: COMPONENTE, value: registro}
          envFrom:
            - configMapRef: {name: endpoints}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /salud, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: registro
  namespace: agentes
spec:
  selector: {app: registro}
  ports:
    - {port: 8000, targetPort: 8000}
