# Los seis componentes: un Deployment y un Service por cada uno.
#
# Todos usan la misma imagen (triage-agentes) y cambian solo COMPONENTE.
# Las etiquetas son lo que seleccionarán las políticas de Cilium:
#   app: <nombre>        identifica a cada componente
#   rol: agente          orquestador, enriquecedor, investigador, defensor, arbitro
#   rol: registro        el sistema de registro (NO es agente)
#
# Aplicar (después de endpoints.yaml y con la imagen cargada en kind):
#   kubectl apply -f deploy/k8s/agentes.yaml
#
# Cada pod es un proceso separado a propósito: sin eso las llamadas entre
# agentes serían de memoria y no habría nada que inspeccionar ni bloquear.

# ─── Orquestador ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orquestador
  namespace: agentes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orquestador
  template:
    metadata:
      labels:
        app: orquestador
        rol: agente
    spec:
      # No montar el token de la API de Kubernetes: ningún componente
      # necesita hablar con el cluster, y un agente comprometido no debe poder.
      automountServiceAccountToken: false
      containers:
        - name: orquestador
          image: triage-agentes:0.3.0
          # Never: la imagen se carga en kind con `kind load`; no existe en
          # ningún registro remoto y no queremos que el nodo intente bajarla.
          imagePullPolicy: Never
          env:
            - name: COMPONENTE
              value: orquestador
          # Todas las URLs, modelos, presupuesto y timeouts vienen del ConfigMap.
          envFrom:
            - configMapRef:
                name: endpoints
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /salud, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: orquestador
  namespace: agentes
spec:
  selector: {app: orquestador}
  ports:
    - port: 8000
      targetPort: 8000

