# Egress hacia vLLM en el HOST (Camino B). Se aplica ADEMÁS de estricta.yaml
# (Cilium suma las políticas que seleccionan a un pod).
#
# Reexpresa la columna "Sale al modelo grande" de la matriz de permisos cuando
# el modelo no es un pod sino un proceso del host:
#   - Enriquecedor  -> SOLO el modelo local  (host :18001)
#   - Inv/Def/Árb   -> SOLO el modelo grande (host :18000)
# La separación se hace por PUERTO del host. Enriquecedor no puede abrir el
# 18000, así que no alcanza el modelo grande aunque comparta host.
#
# El destino es el host visto desde el pod (`toEntities: [host]`), acotado por
# puerto. NADA más se abre: sin estas reglas y las de estricta.yaml, todo egress
# que no sea DNS queda bloqueado (no hay salida a internet).
#
# NOTA de verificación en dCloud: en algunos kind la IP del host se clasifica
# como `world` en vez de `host`. Si tras aplicar esto el modelo no responde
# (pero `curl` directo al host sí), cambiar `toEntities: [host]` por
# `toCIDRSet: [{cidr: <IP-del-host>/32}]` (la IP la imprime vllm-up.sh) en las
# tres reglas. El resto no cambia.
#
#   kubectl apply -f deploy/k8s/politicas/vllm-host-egress.yaml

# ═══ Enriquecedor -> modelo LOCAL (host :18001) ══════════════════════════════
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: enriquecedor-vllm-local
  namespace: agentes
spec:
  endpointSelector:
    matchLabels: {app: enriquecedor}
  egress:
    - toEntities: [host]
      toPorts:
        - ports: [{port: "18001", protocol: TCP}]
---
# ═══ Investigador / Defensor / Árbitro -> modelo GRANDE (host :18000) ═════════
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: debatientes-vllm-grande
  namespace: agentes
spec:
  endpointSelector:
    matchExpressions:
      - {key: app, operator: In, values: [investigador, defensor, arbitro]}
  egress:
    - toEntities: [host]
      toPorts:
        - ports: [{port: "18000", protocol: TCP}]
